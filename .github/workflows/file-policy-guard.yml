name: File Policy Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (report only, no enforcement)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  pull-requests: write
  checks: read

env:
  # Set to "true" to enable dry-run mode via environment variable.
  # The workflow_dispatch input takes precedence if provided.
  FILE_POLICY_DRY_RUN: "false"

jobs:
  enforce-policy:
    name: Evaluate file policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve dry-run flag
        id: config
        run: |
          # workflow_dispatch input takes precedence, then env var
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DRY_RUN="${{ inputs.dry_run }}"
          else
            DRY_RUN="${{ env.FILE_POLICY_DRY_RUN }}"
          fi
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "Dry-run mode: ${DRY_RUN}"

      - name: Get changed files
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            FILES=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          else
            # For workflow_dispatch, compare against default branch
            FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          echo "Changed files:"
          echo "${FILES}"

          # Store as multiline output
          {
            echo "files<<EOF"
            echo "${FILES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate policy
        id: evaluate
        run: |
          EVALUATION=$(echo "${{ steps.changed.outputs.files }}" | python3 .github/scripts/evaluate-policy.py)

          echo "Evaluation result:"
          echo "${EVALUATION}"

          # Store evaluation JSON
          {
            echo "result<<EOF"
            echo "${EVALUATION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Extract tier for later steps
          TIER=$(echo "${EVALUATION}" | python3 -c "import sys, json; print(json.load(sys.stdin)['tier'])")
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"

      - name: Format PR comment
        id: comment
        run: |
          DRY_RUN_FLAG=""
          if [[ "${{ steps.config.outputs.dry_run }}" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          COMMENT=$(echo '${{ steps.evaluate.outputs.result }}' | python3 .github/scripts/format-comment.py ${DRY_RUN_FLAG})

          # Store comment body
          {
            echo "body<<EOF"
            echo "${COMMENT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- file-policy-guard -->';
            const body = `${{ steps.comment.outputs.body }}`;

            // Find existing comment by marker
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              console.log(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
              console.log('Created new comment');
            }

      - name: Enforce required checks
        if: steps.config.outputs.dry_run != 'true' && steps.evaluate.outputs.tier != 'none'
        run: |
          TIER="${{ steps.evaluate.outputs.tier }}"
          echo "Resolved tier: ${TIER}"
          echo "Enforcement is active (not dry-run)."

          # Parse required checks from evaluation
          REQUIRED_CHECKS=$(echo '${{ steps.evaluate.outputs.result }}' | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for check in data['required_checks']:
              print(check)
          ")

          echo ""
          echo "Required checks for ${TIER} tier:"
          echo "${REQUIRED_CHECKS}"
          echo ""

          # Query GitHub Checks API for the current commit
          MISSING_CHECKS=""
          FOUND_CHECKS=""

          while IFS= read -r check_name; do
            [ -z "${check_name}" ] && continue

            # Query check runs for this commit
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs" \
              | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          runs = data.get('check_runs', [])
          for run in runs:
              if run['name'] == '${check_name}':
                  print(run.get('conclusion', 'pending'))
                  sys.exit(0)
          print('not_found')
          ")

            if [[ "${STATUS}" == "success" ]]; then
              FOUND_CHECKS="${FOUND_CHECKS}\n  - ${check_name} (passed)"
            else
              MISSING_CHECKS="${MISSING_CHECKS}\n  - ${check_name} (status: ${STATUS})"
            fi
          done <<< "${REQUIRED_CHECKS}"

          if [[ -n "${MISSING_CHECKS}" ]]; then
            echo ""
            echo "ERROR: The following required checks have not passed:"
            echo -e "${MISSING_CHECKS}"
            echo ""
            echo "Passed checks:"
            echo -e "${FOUND_CHECKS:-  (none)}"
            echo ""
            echo "All required checks must pass for the '${TIER}' tier before merging."
            exit 1
          else
            echo ""
            echo "All required checks passed:"
            echo -e "${FOUND_CHECKS}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
